<script>
var KEY='horas-extras-v1',tab='reg',flt='all',frem=null,emode=false,yr=new Date().getFullYear(),sel=null,editId=null,conf=false;
var S={v:2,types:[{id:1,name:'Tabela A',rate:10},{id:2,name:'Tabela B',rate:12}],rems:['Futebol','Fibra','Controle de Trânsito','Festa'],entries:[]};
try{var raw=localStorage.getItem(KEY);if(raw)S=JSON.parse(raw)}catch(e){}
if(!S.v){S.v=2;S.types=[{id:1,name:'Tabela A',rate:10},{id:2,name:'Tabela B',rate:12}]}
if(!S.rems)S.rems=['Futebol','Fibra','Controle de Trânsito','Festa'];
if(!S.cfg)S.cfg={};(function(){var d=defCfg();for(var k in d)if(S.cfg[k]===undefined)S.cfg[k]=d[k]})();

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function tm(t){var p=t.split(':');return +p[0]*60+ +p[1]}
function dur(s,e){var d=tm(e)-tm(s);if(d<=0)d+=1440;var c=S.cfg||{},r=c.round||0;if(r)d=Math.round(d/r)*r;if(c.min&&d<c.min*60)d=c.min*60;return d}
function fh(m){m=Math.round(m);return Math.floor(m/60)+'h'+String(m%60).padStart(2,'0')}
function eur(v){return v.toFixed(2)+'€'}
function mins(e){return e.hd!=null?(e.hd+(e.hn||0))*60:dur(e.start,e.end)}
function val(e){return e.v!=null?e.v:mins(e)/60*e.rate}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function mname(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,1).toLocaleDateString('pt-PT',{month:'long',year:'numeric'})}
function mshort(i){return new Date(2000,i,1).toLocaleDateString('pt-PT',{month:'short'}).replace('.','')}
function dfmt(d){var p=d.split('-');return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString('pt-PT',{weekday:'short',day:'2-digit',month:'2-digit'})}
function agg(l){var o={n:0,m:0,v:0,pv:0,uv:0};l.forEach(function(e){var m=mins(e),v=val(e);o.n++;o.m+=m;o.v+=v;if(e.paid)o.pv+=v;else o.uv+=v});return o}
function group(l,f){var g={};l.forEach(function(e){var k=f(e);(g[k]=g[k]||[]).push(e)});return g}
function toast(t,a){var x=document.getElementById('toast');x.innerHTML='<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--ok)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg><span>'+esc(t)+'</span>'+(a?'<button class="ta" onclick="'+a.f+'">'+a.l+'</button>':'');x.style.display='flex';clearTimeout(window._tt);window._tt=setTimeout(function(){x.style.display='none'},a?5000:2400)}
function setTab(t){tab=t;cf='';menu=false;ab=false;sel=null;render()}
function render(){
  var T={reg:['Registos','📋'],res:['Resumo','📊'],cfg:['Definições','⚙️']};
  document.getElementById('ttl').innerHTML=hdr();
  document.getElementById('nav').innerHTML=Object.keys(T).map(function(k){return '<button class="'+(k==tab?'on':'')+'" onclick="setTab(\''+k+'\')"><i>'+T[k][1]+'</i>'+T[k][0]+'</button>'}).join('');
  document.getElementById('fab').style.display='none';
  document.getElementById('app').innerHTML=(tab=='reg'?'':'<button class="chip" onclick="setTab(\'reg\')">‹ Voltar</button>')+(tab=='reg'?vReg():tab=='res'?vRes():tab=='gr'?vGr():vCfg());
  document.getElementById('mnuw').innerHTML=mnu()+abt();
  document.getElementById('app').style.zoom=S.cfg.ui||1;
}
var IC={
futebol:['#6ee787','<circle cx="12" cy="12" r="9"/><path d="M12 8.5l3 2.2-1.1 3.5h-3.8L9 10.7z"/><path d="M12 8.5V3M15 10.7l5-1.7M13.9 14.2l2.6 4.8M10.1 14.2L7.5 19M9 10.7L4 9"/>'],
fibra:['#fb923c','<path d="M12 3v18M9 21h6M6 6h12M8 10h8"/><circle cx="6" cy="6" r=".9" fill="currentColor"/><circle cx="18" cy="6" r=".9" fill="currentColor"/><path d="M6 6q6 7 12 0"/>'],
transito:['#60a5fa','<path d="M8 8.5Q12 2.5 16 8.5M7 8.5h10"/><circle cx="12" cy="11.6" r="2.8"/><path d="M5 21q0-7 7-7t7 7"/><circle cx="12" cy="17.8" r="1" fill="currentColor"/>'],
bateria:['#a78bfa','<ellipse cx="12" cy="12" rx="8" ry="3"/><path d="M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6M5 3l6 6M19 3l-6 6"/>'],
festa:['#f472b6','<circle cx="4" cy="12" r="1.8" fill="currentColor"/><circle cx="5.1" cy="8" r="1.8"/><circle cx="8" cy="5.1" r="1.8" fill="currentColor"/><circle cx="12" cy="4" r="1.8"/><circle cx="16" cy="5.1" r="1.8" fill="currentColor"/><circle cx="18.9" cy="8" r="1.8"/><circle cx="20" cy="12" r="1.8" fill="currentColor"/><path d="M4 14v7M20 14v7"/>']};
function autoKey(n){var k=String(n||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();return /futebol|bola/.test(k)?'futebol':/fibra/.test(k)?'fibra':/transito|policia/.test(k)?'transito':/festa/.test(k)?'festa':/bateria|musica/.test(k)?'bateria':'letter'}
function ico(n,sm){
  var r=(S.ri||{})[n]||{},key=r.k||autoKey(n),x=IC[key],c=sm?' s':'',col=r.c||(x?x[0]:''),st=col?' style="--c:'+col+'"':'';
  return x?'<span class="ic'+c+'"'+st+'><svg viewBox="0 0 24 24">'+x[1]+'</svg></span>':!n?'<span class="ic'+c+'" style="--c:var(--ok)"><svg viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M10 12h5M10 16h5"/></svg></span>':'<span class="ic'+c+'"'+st+'><b>'+esc((n||'•').charAt(0).toUpperCase())+'</b></span>';
}
function curve(p){
  if(p.length<2)return '';var d='M'+p[0][0]+' '+p[0][1];
  for(var i=0;i<p.length-1;i++){var a=p[i-1]||p[i],b=p[i],c=p[i+1],e=p[i+2]||c;
    d+=' C'+(+b[0]+(c[0]-a[0])/6).toFixed(1)+' '+(+b[1]+(c[1]-a[1])/6).toFixed(1)+' '+(+c[0]-(e[0]-b[0])/6).toFixed(1)+' '+(+c[1]-(e[1]-b[1])/6).toFixed(1)+' '+c[0]+' '+c[1]}
  return d;
}
function mchart(cm){
  var p=cm.split('-'),y=+p[0],m=+p[1]-1,vs=[],lb=[],i;
  for(i=5;i>=0;i--){var dt=new Date(y,m-i,1),k=dt.getFullYear()+'-'+p2(dt.getMonth()+1);
    vs.push(agg(S.entries.filter(function(e){return e.date.slice(0,7)==k})).v);lb.push(mshort(dt.getMonth()))}
  var mx=Math.max.apply(null,vs)||1,pts=vs.map(function(v,i){return[(20+i*60).toFixed(1),(92-v/mx*66).toFixed(1)]});
  var cv=curve(pts),dots=pts.map(function(q,i){return '<circle cx="'+q[0]+'" cy="'+q[1]+'" r="'+(i==5?5:2.5)+'" fill="#6ee787"/>'}).join('');
  var tx=lb.map(function(l,i){return '<text x="'+(20+i*60)+'" y="122" text-anchor="middle"'+(i==5?' style="fill:#f1f4f8;font-weight:700"':'')+'>'+l+'</text>'}).join('');
  return '<div style="font-size:11px;color:#9aa6b2;margin-top:2px">Últimos 6 meses</div><svg viewBox="0 0 340 130" width="100%" role="img" aria-label="Valor dos últimos 6 meses"><defs><linearGradient id="gf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6ee787" stop-opacity=".35"/><stop offset="1" stop-color="#6ee787" stop-opacity="0"/></linearGradient></defs><path d="'+cv+' L320 104 L20 104Z" fill="url(#gf)"/><path d="'+cv+'" fill="none" stroke="#6ee787" stroke-width="2.5" stroke-linecap="round"/>'+dots+tx+'</svg>';
}
function pickF(i){frem=frem==S.rems[i]?null:S.rems[i];render()}
function pickR(b){document.getElementById('m').value=b.dataset.v;[].forEach.call(b.parentNode.children,function(x){x.classList.toggle('on',x==b)})}
var FI=null,FS=null,F=null,inSh=false,ef='GNR',et='',ST={pend:['Pendente','var(--warn)'],lanc:['Lançado','var(--blue)'],pago:['Pago','var(--pg)']};
var POSTOS={GNR:['Guarda','Cabo','Sargento','Oficial'],PSP:['Agente','Agente Principal','Chefe','Oficial']};
var SHP='<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5L16 9.5"/>',MOON='<path d="M21 13A9 9 0 1111 3a7 7 0 0010 10z"/>',SUN='<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/>';
function svg(p,z){return '<svg width="'+(z||22)+'" height="'+(z||22)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>'}
function defRt(){var r={},g=[[['Guarda','Cabo','Agente','Agente Principal'],51.6,74.27],[['Sargento','Chefe'],54.34,77.03],[['Oficial'],60.51,85.96]];
  g.forEach(function(x){x[0].forEach(function(p){['GNR','PSP'].forEach(function(f){if(POSTOS[f].indexOf(p)>=0)r[f+'|Tabela A|'+p]={d:x[1],n:x[2]}})})});return r}
function isDark(){var t=S.cfg.theme;return t=='dark'||(t=='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches)}
function tgTheme(){S.cfg.theme=isDark()?'light':'dark';save();applyTheme();render()}
function hdr(){
  var h=S.cfg.hide,n=S.cfg.net,dk=isDark(),ey='<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>';
  return '<div class="av">'+iconHTML()+'</div><h1>'+esc(S.cfg.title||'Gratificados.')+'</h1>'+
  '<button class="hb'+(h?' on1':'')+'" aria-label="Esconder totais" onclick="S.cfg.hide=!S.cfg.hide;save();render();toast(S.cfg.hide?\'Totais Ocultos (Privacidade Ativa)\':\'Totais Visíveis\')">'+svg(ey+(h?'<path d="M3 3l18 18"/>':''),18)+'</button>'+
  '<button class="hb'+(n?' on2':'')+'" aria-label="Valores líquidos" onclick="S.cfg.net=!S.cfg.net;save();render();toast(S.cfg.net?\'Valores Líquidos (−\'+(S.cfg.tax||0)+\'%)\':\'Valores Brutos\')">'+svg('<path d="M3 7a2 2 0 012-2h13v4"/><path d="M3 7v10a2 2 0 002 2h15V9H5a2 2 0 01-2-2z"/><circle cx="16" cy="14" r="1" fill="currentColor"/>',18)+'</button>'+
  '<button class="hb f'+(dk?' sun':'')+'" aria-label="Tema" onclick="tgTheme()">'+svg(dk?SUN:MOON,18)+'</button>'+
  '<button class="hb f" aria-label="Gráfico por mês" onclick="setTab(\'gr\')">'+svg('<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',18)+'</button>'+
  '<button class="hb f" aria-label="Menu" onclick="menu=!menu;render()">'+svg('<circle cx="12" cy="5" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="12" cy="19" r="1.3" fill="currentColor"/>',18)+'</button>';
}
var menu=false,UP='<path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 001 1h14a1 1 0 001-1v-3"/>',DN='<path d="M12 4v12M7 11l5 5 5-5"/><path d="M4 16v3a1 1 0 001 1h14a1 1 0 001-1v-3"/>';
var ab=false;
function abt(){
  if(!ab)return '';
  return '<div id="mo2" onclick="ab=false;render()"></div><div id="abt"><div class="av" style="margin:0 auto 14px;width:56px;height:56px;border-radius:18px;display:grid;place-items:center">'+iconHTML(30)+'</div><h2>Sobre</h2><p>Agradeço a todos os militares do Posto Territorial de Mira de Aire, Batalha, Lourosa e Carvalhos!</p><p class="sg">Sou o Guarda Pinheiro do Pter dos Carvalhos!</p><button class="btn" onclick="ab=false;render()">Fechar</button></div>';
}
function vGr(){
  var ys=years(),l=S.entries.filter(function(e){return e.date.slice(0,4)==yr}),gm=group(l,function(e){return +e.date.slice(5,7)-1}),mx=0,bi=-1,i;
  for(i=0;i<12;i++){var n=gm[i]?gm[i].length:0;if(n>mx){mx=n;bi=i}}
  var h='<div class="chips">'+ys.map(function(y){return '<button class="chip '+(y==yr?'on':'')+'" onclick="yr='+y+';sel=null;render()">'+y+'</button>'}).join('')+'</div>';
  if(bi<0)return h+'<div class="empty">Ainda não há gratificados em '+yr+'.</div>';
  var b=agg(gm[bi]),s=sel==null?bi:sel;
  h+='<div class="card"><span class="lbl">Mês com mais gratificados</span><div class="big" style="text-transform:capitalize;margin:8px 0 4px">'+new Date(2000,bi,1).toLocaleDateString('pt-PT',{month:'long'})+'</div><div class="m">'+b.n+' gratificados · '+fh(b.m)+' · '+eur(b.v)+'</div></div>';
  var svg='<svg viewBox="0 0 340 190" width="100%" role="img" aria-label="Gratificados por mês">';
  for(i=0;i<12;i++){
    var c=gm[i]?gm[i].length:0,x=8+i*27.5,hh=c/mx*130;
    svg+='<g onclick="sel='+i+';render()"><rect x="'+(x-3)+'" y="10" width="26" height="165" fill="'+(s==i?'var(--in)':'transparent')+'" rx="6"/><rect class="'+(i==bi?'bp':'bn')+'" x="'+x+'" y="'+(160-hh)+'" width="20" height="'+hh+'" rx="3"/>'+(c?'<text x="'+(x+10)+'" y="'+(156-hh)+'" text-anchor="middle">'+c+'</text>':'')+'<text x="'+(x+10)+'" y="176" text-anchor="middle" style="'+(s==i?'font-weight:700;fill:var(--tx)':'')+'">'+mshort(i)+'</text></g>';
  }
  svg+='</svg>';
  var d=gm[s]?agg(gm[s]):null;
  h+='<div class="card"><b>Gratificados por mês em '+yr+'</b>'+svg+'<div class="pv" style="text-align:left"><b style="text-transform:capitalize">'+new Date(2000,s,1).toLocaleDateString('pt-PT',{month:'long'})+'</b>: '+(d?d.n+' gratificados · '+fh(d.m)+' · '+eur(d.v):'sem gratificados')+'</div></div>';

function saveRem(){
  var n=rtmp.n.trim(),i=rtmp.i,o=i>=0?S.rems[i]:null;

  else if(o!==n){S.rems[i]=n;S.entries.forEach(function(e){if(e.rem==o)e.rem=n});delete S.ri[o];if(frem==o)frem=n}
  S.ri[n]={k:rtmp.k,c:rtmp.c};save();closeSheet();render();toast('Guardado');
}

function b64(d){if(typeof d=='string')return btoa(unescape(encodeURIComponent(d)));var u=new Uint8Array(d.buffer||d),s='',i;for(i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)}
async function out(name,data,type){
  var Pl=window.Capacitor&&Capacitor.Plugins;
  if(Pl&&Pl.Filesystem&&Pl.Share){try{var w=await Pl.Filesystem.writeFile({path:name,data:b64(data),directory:'CACHE'});await Pl.Share.share({title:name,url:w.uri});bk();toast('Backup Exportado');return}catch(e){if(e&&/cancel/i.test(String(e.message||e)))return}}
  var dl=null;try{dl=window.claude&&await claude.use('downloads')}catch(e){}
  if(dl){try{await dl.save({filename:name,data:data});bk();toast('Backup Exportado')}catch(e){if(!e||e.code!='declined')toast('Não foi possível exportar')}return}
  var C=window.Capacitor;
  if(C&&C.isNativePlatform&&C.isNativePlatform()&&C.Plugins&&C.Plugins.Filesystem&&C.Plugins.Share){
    try{var b64;if(typeof data=='string'){b64=btoa(unescape(encodeURIComponent(data)))}else{var u8=new Uint8Array(data),bin='';for(var i=0;i<u8.length;i++)bin+=String.fromCharCode(u8[i]);b64=btoa(bin)}
      var w=await C.Plugins.Filesystem.writeFile({path:name,data:b64,directory:'CACHE'});await C.Plugins.Share.share({title:name,url:w.uri,dialogTitle:'Guardar backup'});bk();toast('Backup Exportado');return}catch(e){}
  }
  try{var f=new File([data],name,{type:type});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});bk();toast('Backup Exportado');return}}catch(e){if(e&&e.name=='AbortError')return}
  var a=document.createElement('a'),u=URL.createObjectURL(new Blob([data],{type:type}));
  a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(u)},4000);bk();toast('Backup Exportado');
}
function xrows(b){var wb=XLSX.read(b,{type:'array'});return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]])}
function parseCsv(t){
  t=t.replace(/^\ufeff/,'');var l=t.split('\n')[0],d=l.split(';').length>l.split(',').length?';':',',rows=[],row=[],f='',q=false,i,c;
  for(i=0;i<t.length;i++){c=t[i];
    if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
    else if(c=='"')q=true;
    else if(c==d){row.push(f);f=''}
    else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;row.push(f);f='';rows.push(row);row=[]}
    else f+=c}
  if(f||row.length){row.push(f);rows.push(row)}
  var hd=(rows.shift()||[]).map(function(x){return x.trim()});
  return rows.filter(function(r){return r.some(function(x){return x.trim()})}).map(function(r){var o={};hd.forEach(function(h,j){o[h]=r[j]});return o});
}
async function exp(){
  var rows=S.entries.slice().sort(function(a,b){return a.date<b.date?-1:1}).map(function(e){return{'Data':e.date,'Identificação':e.ident||'','Força':e.f||'','Tipo':e.name,'Posto':e.posto||'','Tipo de remunerado':e.rem||'','Início':e.start||'','Fim':e.end||'','Diurnas':e.hd!=null?e.hd:+(mins(e)/60).toFixed(2),'Noturnas/FDS':e.hn||0,'Horas':+(mins(e)/60).toFixed(2),'Coordenação':e.coord?'Sim':'Não','Valor':+val(e).toFixed(2),'Estado':ST[e.st||'pend'][0],'Observações':e.note||''}});
  var gm=group(S.entries,function(e){return e.date.slice(0,7)}),rs=Object.keys(gm).sort().map(function(k){var b=agg(gm[k]);return{'Mês':k,'Serviços':b.n,'Horas':+(b.m/60).toFixed(2),'Média h/serviço':+(b.m/60/b.n).toFixed(2),'Valor':+b.v.toFixed(2),'Pago':+b.pv.toFixed(2),'Por pagar':+b.uv.toFixed(2)}});
  if(window.XLSX){
    var wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Registos');
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rs),'Resumo mensal');
    return out('gratificados.xlsx',XLSX.write(wb,{type:'array',bookType:'xlsx'}),'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
  }
  var hd=['Data','Identificação','Força','Tipo','Posto','Tipo de remunerado','Início','Fim','Diurnas','Noturnas/FDS','Horas','Coordenação','Valor','Estado','Observações'];
  var q=function(v){v=String(v==null?'':v);return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  var csv='\ufeff'+hd.join(';')+'\n'+rows.map(function(r){return hd.map(function(k){return typeof r[k]=='number'?String(r[k]).replace('.',','):q(r[k])}).join(';')}).join('\n');
  return out('gratificados.csv',csv,'text/csv;charset=utf-8');
}
function p2(n){return String(n).padStart(2,'0')}
function pd(v){
  if(typeof v=='number'){var d=new Date(Math.round((v-25569)*864e5));return d.getUTCFullYear()+'-'+p2(d.getUTCMonth()+1)+'-'+p2(d.getUTCDate())}
  var s=String(v||''),m=s.match(/(\d{4})-(\d{2})-(\d{2})/);if(m)return m[0];
  m=s.match(/(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/);return m?m[3]+'-'+p2(m[2])+'-'+p2(m[1]):null
}
function pt(v){
  if(typeof v=='number'){var x=Math.round((v%1)*1440);return p2(Math.floor(x/60)%24)+':'+p2(x%60)}
  var m=String(v||'').match(/(\d{1,2}):(\d{2})/);return m?p2(m[1])+':'+m[2]:null
}
function imp(inp){
  var f=inp.files[0];if(!f)return;
  var csv=/\.csv$/i.test(f.name)||!window.XLSX,r=new FileReader();
  r.onload=function(){
    try{
      var rows=csv?parseCsv(r.result):xrows(r.result),add=0,skip=0;
      function num(v){return parseFloat(String(v==null?'':v).replace(',','.'))}
      rows.forEach(function(x,i){
        var d=pd(x['Data']),s=pt(x['Início']||x['Inicio'])||'',e=pt(x['Fim'])||'',hd=num(x['Diurnas']),hn=num(x['Noturnas/FDS']);
        if(isNaN(hd)&&isNaN(hn)){hd=s&&e?dur(s,e)/60:num(x['Horas'])}
        hd=hd||0;hn=hn||0;
        if(!d||!(hd+hn)){skip++;return}
        var nm=String(x['Tipo']||'Tabela A'),rm=String(x['Tipo de remunerado']||'').trim(),id=String(x['Identificação']||'').trim(),po=String(x['Posto']||'').trim(),fo=/psp/i.test(String(x['Força']||''))?'PSP':'GNR',es=String(x['Estado']||x['Pago']||''),st=/pago|^sim$|^s$|^1$|true|yes/i.test(es)?'pago':/lan/i.test(es)?'lanc':'pend',v=num(x['Valor']),rt=num(x['€/hora']);
        if(S.entries.some(function(z){return z.date==d&&z.start==s&&z.end==e&&z.name==nm&&(z.ident||'')==id&&Math.abs(mins(z)-(hd+hn)*60)<1})){skip++;return}
        S.entries.push({id:Date.now()+i,date:d,ident:id,start:s,end:e,name:nm,posto:po,f:fo,hd:hd,hn:hn,coord:/^(sim|s|1|true|yes)$/i.test(String(x['Coordenação']||'')),rem:rm,st:st,paid:st=='pago',note:String(x['Observações']||''),v:isNaN(v)?null:v,rate:isNaN(rt)?(isNaN(v)?0:v/(hd+hn)):rt});
        if(rm&&S.rems.indexOf(rm)<0)S.rems.push(rm);
        if(!S.types.some(function(z){return z.name==nm}))S.types.push({id:Date.now()+1000+i,name:nm,rate:0});
        add++;
      });
      save();render();toast(add+' importados'+(skip?', '+skip+' ignorados':''));
    }catch(err){toast('Ficheiro inválido')}
    inp.value='';
  };
  if(csv)r.readAsText(f);else r.readAsArrayBuffer(f);
}
